<!DOCTYPE html>
<html>
<head>
    <title>PhishGuard</title>
</head>
<body>
    <h1>PhishGuard Dashboard</h1>

    <button onclick="loadThreats()">Load Threats</button>
    <button onclick="loadCampaigns()">Load Campaigns</button>
    <button onclick="fetchGmail()">Fetch Gmail</button>

    <pre id="output"></pre>

    <script>
        const API = "http://127.0.0.1:8001";

        async function loadThreats() {
            const r = await fetch(API + "/threats");
            show(await r.json());
        }

        async function loadCampaigns() {
            const r = await fetch(API + "/campaigns");
            show(await r.json());
        }

        async function fetchGmail() {
            const r = await fetch(API + "/gmail/fetch");
            show(await r.json());
        }

        function show(data) {
            document.getElementById("output").textContent =
                JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
